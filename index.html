{ day: "తొమ్మిదవ రోజు", heading: "శ్రీ సిద్ధిదాత్రి దేవి", img: "తొమ్మిదవ రోజు.jpg", special: "", video: "", desc: "తొమ్మిదో రోజు అమ్మవారు శ్రీ సిద్ధిదాత్రి దేవిగా దర్శనమిస్తారు.\nప్రసాదం/నైవేద్యం: చక్రపొంగలి." }
];

let templeData = [];

function loadDataFromCloudFirst() {
    fetch(API_URL + "?t=" + new Date().getTime(), {
        cache: 'no-store'
    })
    .then(response => response.json())
    .then(data => {
        if (data && Array.isArray(data) && data.length === 10) {
            templeData = data;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(templeData));
        } else {
            loadLocalFallback();
        }
        renderApp();
    })
    .catch(error => {
        loadLocalFallback();
        renderApp();
    });
}

function loadLocalFallback() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length === 10) {
                templeData = parsed;
                return;
            }
        }
    } catch(e) {}
    templeData = defaultTempleData.map(item => ({...item}));
}

function saveDataToCloud() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(templeData));

    fetch(API_URL, {
        method: 'PUT',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(templeData)
    })
    .then(response => response.json())
    .then(data => {
        showToast("toast-success");
        renderApp();
        renderDaysSelector();
        closeAdminModal();
    })
    .catch(error => {
        showToast("toast-success");
        renderApp();
        renderDaysSelector();
        closeAdminModal();
    });
}

function getSeenVideos() {
    try { return JSON.parse(localStorage.getItem(SEEN_VIDEOS_KEY) || "{}"); } catch (e) { return {}; }
}

function setSeenVideo(index, videoLink) {
    try {
        const seen = getSeenVideos();
        seen[index] = videoLink;
        localStorage.setItem(SEEN_VIDEOS_KEY, JSON.stringify(seen));
    } catch (e) {}
}

function showToast(id) {
    const toast = document.getElementById(id);
    toast.className = "toast show";
    setTimeout(() => { toast.className = "toast"; }, 2500);
}

function renderApp() {
    const grid = document.getElementById("avatars-grid");
    if (!grid) return;
    grid.innerHTML = "";
    const seenVideos = getSeenVideos();

    templeData.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "avatar-box";

        if (item.video && item.video.trim() !== "" && seenVideos[index] !== item.video) {
            const greenDot = document.createElement("div");
            greenDot.className = "notification-dot";
            card.appendChild(greenDot);
        }

        const img = document.createElement("img");
        img.src = item.img;
        img.alt = item.day;
        img.onerror = function() { this.src = placeholderImg; };

        const title = document.createElement("h4");
        title.textContent = item.day;

        const heading = document.createElement("p");
        heading.textContent = item.heading;

        card.appendChild(img);
        card.appendChild(title);
        card.appendChild(heading);

        if (item.special && item.special.trim() !== "") {
            const specialBox = document.createElement("div");
            specialBox.className = "card-special-box";
            specialBox.textContent = "✨ " + item.special;
            card.appendChild(specialBox);
        }

        card.addEventListener("click", function() { openDetail(index); });
        grid.appendChild(card);
    });
}

function openDetail(index) {
    const item = templeData[index];
    if (item.video && item.video.trim() !== "") {
        setSeenVideo(index, item.video);
        renderApp();
    }

    document.getElementById("home-view").classList.add("hidden");
    document.getElementById("detail-view").classList.remove("hidden");

    const content = document.getElementById("detail-content");
    content.innerHTML = "";

    const day = document.createElement("h4");
    day.style.color = "#ffca28";
    day.style.fontSize = "16px";
    day.textContent = item.day;

    const img = document.createElement("img");
    img.src = item.img;
    img.className = "detail-img";
    img.alt = item.heading;
    img.onerror = function() { this.src = placeholderImg; };

    const heading = document.createElement("h2");
    heading.style.color = "#ffb300";
    heading.style.fontSize = "19px";
    heading.textContent = item.heading;

    content.appendChild(day);
    content.appendChild(img);
    content.appendChild(heading);

    if (item.special && item.special.trim() !== "") {
        const specialBox = document.createElement("div");
        specialBox.className = "special-highlight-box";
        specialBox.innerHTML = `<h5>✨ ఇరోజు స్పెషల్ / విశేషాలు:</h5><p>${item.special}</p>`;
        content.appendChild(specialBox);
    }

    const desc = document.createElement("div");
    desc.className = "normal-desc";
    desc.textContent = item.desc;
    content.appendChild(desc);

    if (item.video && item.video.trim() !== "") {
        const videoCard = document.createElement("a");
        videoCard.href = item.video;
        videoCard.target = "_blank";
        videoCard.style.textDecoration = "none";
        videoCard.innerHTML = `
            <div class="video-preview-card">
                <div class="video-thumb-container">
                    <img src="${item.img}" alt="Video Thumbnail" onerror="this.src='${placeholderImg}'">
                    <div class="play-icon-overlay">▶</div>
                </div>
                <h5>🎬 ప్రత్యేక వీడియో / రీల్ వీక్షించండి</h5>
                <p>ప్లే చేయడానికి ఇక్కడ నొక్కండి (Click to Play)</p>
            </div>
        `;
        content.appendChild(videoCard);
    }

    window.scrollTo(0, 0);
}

function goHome() {
    document.getElementById("detail-view").classList.add("hidden");
    document.getElementById("home-view").classList.remove("hidden");
}

function openAdminModal() {
    currentEditingIndex = 0;
    renderDaysSelector();
    loadAdminFields(0);
    document.getElementById("admin-modal").style.display = "block";
}

function closeAdminModal() {
    document.getElementById("admin-modal").style.display = "none";
}

function renderDaysSelector() {
    const container = document.getElementById("days-select-container");
    if (!container) return;
    container.innerHTML = "";
    templeData.forEach((item, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "day-sel-btn" + (index === currentEditingIndex ? " active" : "");
        button.textContent = item.day;
        button.addEventListener("click", function() { selectDayToEdit(index); });
        container.appendChild(button);
    });
}

function selectDayToEdit(index) {
    currentEditingIndex = index;
    renderDaysSelector();
    loadAdminFields(index);
}

function loadAdminFields(index) {
    const item = templeData[index];
    document.getElementById("edit-day").value = item.day;
    document.getElementById("edit-heading").value = item.heading;
    document.getElementById("edit-special").value = item.special || "";
    document.getElementById("edit-video").value = item.video || "";
    document.getElementById("edit-desc").value = item.desc;
}

function saveChanges() {
    const dayName = document.getElementById("edit-day").value.trim();
    const heading = document.getElementById("edit-heading").value.trim();
    const specialText = document.getElementById("edit-special").value.trim();
    const videoLink = document.getElementById("edit-video").value.trim();
    const desc = document.getElementById("edit-desc").value;

    if (!dayName || !heading || !desc.trim()) {
        alert("దయచేసి రోజు పేరు, శీర్షిక మరియు వివరాలు నమోదు చేయండి.");
        return;
    }

    templeData[currentEditingIndex].day = dayName;
    templeData[currentEditingIndex].heading = heading;
    templeData[currentEditingIndex].special = specialText;
    templeData[currentEditingIndex].video = videoLink; 
    templeData[currentEditingIndex].desc = desc;

    saveDataToCloud();
}

function saveChangesSafe() {
    try { saveChanges(); } catch (error) { showToast("toast-error"); }
}

document.getElementById("saveBtn").addEventListener("click", saveChangesSafe);
document.getElementById("closeBtn").addEventListener("click", closeAdminModal);
document.getElementById("backBtn").addEventListener("click", goHome);

loadDataFromCloudFirst();
</script>
